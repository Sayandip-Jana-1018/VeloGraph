[project]
name = "velograph"
version = "0.1.0"
description = "VeloGraph: data ingestion, Kafka producers, live gateway and the PySpark ML lab"
requires-python = "==3.11.*"
dependencies = [
    "httpx>=0.28",
    "tenacity>=9.0",
    "typer>=0.15",
    "rich>=13.9",
    "orjson>=3.10",
    "tzdata>=2025.1",
    "confluent-kafka>=2.16",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]
spark = ["pyspark==3.5.8", "pyarrow>=17", "pandas>=2.2", "numpy>=1.26"]
lab = ["jupyterlab>=4.3", "ipykernel>=6.29", "matplotlib>=3.9", "seaborn>=0.13"]
api = ["fastapi>=0.143", "uvicorn[standard]>=0.34", "sse-starlette>=2.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velograph"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "LOG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
