# VeloGraph local cluster - ARCHITECTURE §3 and §9.1.
#   kafka   : 3-node KRaft Kafka (broker + controller per node, no ZooKeeper), topic bootstrap, Kafka UI
#   spark   : Spark standalone master + 2 workers
#   history : Spark history server (on demand)
# Sized for the 6 GB Docker VM set in %USERPROFILE%\.wslconfig. Run from the repository root:
#   docker compose -f infra/docker-compose.yml --profile kafka --profile spark up -d
name: velograph

x-kafka: &kafka
  image: apache/kafka:4.3.1
  profiles: [kafka]
  restart: unless-stopped
  mem_limit: 640m
  healthcheck:
    # A port probe, not kafka-broker-api-versions.sh: that would start a JVM every interval on every node.
    test: ["CMD-SHELL", "nc -z localhost 19092"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

x-kafka-env: &kafka-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
  # Shared by all three nodes so they format into one cluster. Any base64 UUID works; keep it stable.
  CLUSTER_ID: wbsc1cdKSCu6778sMe27uQ

x-spark: &spark
  image: apache/spark:3.5.8-scala2.12-java17-python3-ubuntu
  profiles: [spark]
  restart: unless-stopped
  volumes:
    - ../data:/opt/velograph/data
    - ../conf:/opt/velograph/conf:ro
    - ../spark/target/scala-2.12:/opt/velograph/jars:ro
    - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  environment: &spark-env
    VELOGRAPH_MODE: cluster
    VELOGRAPH_DATA_ROOT: /opt/velograph/data
    VELOGRAPH_CONF_DIR: /opt/velograph/conf
    SPARK_PUBLIC_DNS: localhost # UI links that open from the host browser
    SPARK_DAEMON_MEMORY: 256m
    SPARK_WORKER_DIR: /tmp/spark-work

services:
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    container_name: velograph-kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
    volumes: [kafka-1-data:/var/lib/kafka/data]

  kafka-2:
    <<: *kafka
    hostname: kafka-2
    container_name: velograph-kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094
    volumes: [kafka-2-data:/var/lib/kafka/data]

  kafka-3:
    <<: *kafka
    hostname: kafka-3
    container_name: velograph-kafka-3
    ports: ["9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,EXTERNAL://localhost:9096
    volumes: [kafka-3-data:/var/lib/kafka/data]

  kafka-init:
    image: apache/kafka:4.3.1
    profiles: [kafka]
    container_name: velograph-kafka-init
    restart: "no"
    mem_limit: 384m
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      BOOTSTRAP: kafka-1:19092,kafka-2:19092,kafka-3:19092
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes: ["./kafka/create-topics.sh:/opt/velograph/create-topics.sh:ro"]
    entrypoint: ["/bin/bash", "/opt/velograph/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: [kafka]
    container_name: velograph-kafka-ui
    restart: unless-stopped
    mem_limit: 448m
    ports: ["8089:8080"]
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: velograph
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms96m -Xmx224m

  spark-master:
    <<: *spark
    hostname: spark-master
    container_name: velograph-spark-master
    # Client-mode drivers are submitted from this container (scripts/submit.ps1 -Mode cluster), hence the headroom.
    mem_limit: 1280m
    ports: ["8080:8080", "7077:7077", "4040-4042:4040-4042"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/json/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  spark-worker-1:
    <<: *spark
    hostname: spark-worker-1
    container_name: velograph-spark-worker-1
    mem_limit: 1408m # worker daemon + one 768 MB executor and its JVM overhead
    ports: ["8081:8081"]
    depends_on: { spark-master: { condition: service_healthy } }
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "2", "--memory", "900m", "--webui-port", "8081"]

  spark-worker-2:
    <<: *spark
    hostname: spark-worker-2
    container_name: velograph-spark-worker-2
    mem_limit: 1408m
    ports: ["8082:8082"]
    depends_on: { spark-master: { condition: service_healthy } }
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "2", "--memory", "900m", "--webui-port", "8082"]

  spark-history:
    <<: *spark
    profiles: [history]
    hostname: spark-history
    container_name: velograph-spark-history
    mem_limit: 640m
    ports: ["18080:18080"]
    environment:
      <<: *spark-env
      SPARK_HISTORY_OPTS: -Dspark.history.fs.logDirectory=file:///opt/velograph/data/spark-events
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
