# Spark defaults inside the Docker cluster (mounted at /opt/spark/conf/spark-defaults.conf).
# Memory fits the 6 GB Docker VM: one 768 MB executor per worker, a 640 MB client-mode driver in spark-master.
spark.master                     spark://spark-master:7077
spark.driver.memory              640m
spark.executor.memory            768m
spark.executor.cores             2
spark.sql.session.timeZone       America/New_York
spark.serializer                 org.apache.spark.serializer.KryoSerializer
spark.eventLog.enabled           true
spark.eventLog.dir               file:///opt/velograph/data/spark-events
spark.history.fs.logDirectory    file:///opt/velograph/data/spark-events
spark.ui.showConsoleProgress     false
spark.driver.extraJavaOptions    -Dlog4j.configurationFile=file:/opt/velograph/conf/log4j2.properties
