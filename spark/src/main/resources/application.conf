# VeloGraph defaults.
# Layering (highest first): VELOGRAPH_* environment variables > conf/<mode>.conf > this file.
# See velograph.common.AppConfig.
velograph {
  mode = "dev"
  data-root = "data"

  spark {
    # Used only when neither spark-submit nor spark-defaults.conf sets spark.master.
    master = "local[20]"

    # Applied with setIfMissing: values from spark-submit --conf and spark-defaults.conf take precedence.
    conf {
      "spark.sql.session.timeZone" = "America/New_York"
      "spark.sql.shuffle.partitions" = "96"
      "spark.sql.adaptive.enabled" = "true"
      "spark.sql.sources.partitionOverwriteMode" = "dynamic"
      "spark.serializer" = "org.apache.spark.serializer.KryoSerializer"
      "spark.eventLog.enabled" = "true"
      # Record cached-block updates too, so the history server's Storage tab shows what each job cached.
      "spark.eventLog.logBlockUpdates.enabled" = "true"
      # Event logs compress about tenfold (zstd); the history server reads them as they are.
      "spark.eventLog.compress" = "true"
      "spark.ui.showConsoleProgress" = "false"
    }
  }

  # Silver data-quality rules (velograph.etl.DqRules). A trip failing any rule is quarantined with a reason code.
  dq {
    min-duration-s = 60     # Citi Bike drops sub-minute "false starts" itself; anything left is noise
    max-duration-s = 14400  # 4 h: beyond this a bike was almost certainly not docked properly
    max-speed-kmh = 45      # straight-line speed; e-bikes are capped at 32 km/h of assist
    # New York City plus Jersey City and Hoboken, with a margin.
    bbox { min-lat = 40.45, max-lat = 41.00, min-lng = -74.30, max-lng = -73.65 }
  }

  # Date dimension span (silver/calendar): the trip months plus the live period.
  calendar { from = "2026-06-01", to = "2026-12-31" }

  gold {
    # Inclusive dates of the station x hour panel, the route edges and the SQL insights: the trip months exactly.
    panel { from = "2026-06-01", to = "2026-09-30" }
    # Working-day commute windows as [start, end) hours (07:00-09:59 and 16:00-18:59).
    peaks { am-start = 7, am-end = 10, pm-start = 16, pm-end = 19 }
  }

  # RDD fundamentals demo (P2.3): one raw month, read as plain text lines.
  rdd-demo { month = "202609" }

  # GraphX network analytics (P3, ARCHITECTURE §7) over gold/route_edges.
  graph {
    # Edge partitions. A perfect square suits EdgePartition2D: each vertex is copied to at most 2·√16 − 1 = 7.
    partitions = 16
    reset-prob = 0.15     # PageRank teleport probability, i.e. damping 0.85
    pagerank-tol = 1e-4   # a vertex stops sending once its rank changes by less (un-normalized ranks average 1)
    max-supersteps = 100  # safety cap for every Pregel run (PageRank, personalized PageRank, travel times)
    # Strong ties: communities, triangles and hop counts use only these.
    strong { min-trips = 20, top-k = 10 }
    lpa-supersteps = 30
    min-community-size = 3   # smaller label groups are reported as "no community" (id 0)
    hubs = 10
    # Isochrone and personalized-PageRank sources: high-PageRank stations spread over the city.
    landmarks { count = 20, min-separation-km = 2.0 }
    travel-time-min-trips = 10   # median ride times of rarer routes are too noisy for travel-time paths
    ppr-tol = 1e-6
    # The step-by-step Pregel demo: the top hub and its strongest partners, every superstep recorded.
    explainer { stations = 8 }
    # Rough boxes around the office districts, only to check where morning riders end up (P3 acceptance):
    # the share of the `shift-sample` highest AM-PageRank stations inside them, against the same for PM.
    shift-sample = 50
    office-districts = [
      { name = "Midtown", min-lat = 40.740, max-lat = 40.768, min-lon = -74.010, max-lon = -73.965 }
      { name = "Lower Manhattan", min-lat = 40.700, max-lat = 40.720, min-lon = -74.020, max-lon = -73.995 }
    ]
    exports { flows = 2000, peak-flows = 1000, ppr-destinations = 50, top-stations = 20 }
  }

  # Machine learning (P4, ARCHITECTURE §8).
  ml {
    seed = 315
    # Leakage-safe windows (ARCHITECTURE §8.2). Each split's profile, graph and archetype features come from its
    # profile window, which ends before the split's rows start; MlConfig refuses any other layout.
    windows {
      profile-a  { from = "2026-06-06", to = "2026-07-31" } # 8 weeks -> features of the fit rows
      fit        { from = "2026-08-01", to = "2026-08-31" }
      validation { from = "2026-08-25", to = "2026-08-31" } # the last fit week: tuning only
      profile-b  { from = "2026-07-07", to = "2026-08-31" } # 8 weeks -> features of the test rows
      test       { from = "2026-09-01", to = "2026-09-30" } # final evaluation, never used for tuning
      # Live scoring: the last 8 weeks of published trips stand in for "the 8 weeks before go-live", because
      # a month's trip file appears only after the month ends.
      profile-l  { from = "2026-08-06", to = "2026-09-30" }
      live       { from = "2026-10-01", to = "2026-12-31" }
    }
    # Station archetypes (P4.1): KMeans over daily share profiles, k chosen by silhouette.
    archetypes {
      k-min = 3
      k-max = 10
      max-iter = 60
      # Eight weeks give only eight samples per weekday hour, so hours are summed into bins before clustering
      # (silhouette 0.13 -> 0.21 at k = 3); names and charts still use the hourly curves.
      bin-hours = 3
      restarts = 5               # KMeans runs per k, from different seeds; the lowest within-cluster cost is kept
      min-cluster-share = 0.02   # a k whose smallest cluster is a sliver of outliers is not a set of archetypes
      min-trips = 300 # stations with fewer trips in the window are assigned but do not shape the clusters
      # A centroid is a morning origin (or destination) when its working-day AM departures are this many times
      # its AM arrivals (or the reverse), and "leisure" when a day off is at least this busy as a working day.
      commute-ratio = 1.4
      strong-ratio = 2.2
      leisure-ratio = 1.0
    }
    # Regime classes (ARCHITECTURE §8.1): an hour drains (fills) a station when its net flow is below (above)
    # -tau (+tau) times its capacity. Tau is this quantile of |net flow| / capacity over the fit rows.
    regime { quantile = 0.7 }

    # The models the PySpark lab chose (P4.4-P4.5): algorithm and complete parameters, as in its exports
    # (ml-regression.json, ml-classification.json). TrainChampionJob retrains them on the fit split and must
    # reproduce the lab's September score within champion-tolerance.
    champion-tolerance = 0.01
    champions {
      departures {
        algorithm = "random-forest", label = "departures"
        params { numTrees = 30, maxDepth = 12, subsamplingRate = 0.5, minInstancesPerNode = 20, maxMemoryInMB = 1024, cacheNodeIds = true, seed = 315 }
      }
      # Trained on absolute loss (it is judged on MAE), it edged out the random forest on the validation week.
      arrivals {
        algorithm = "gbt", label = "arrivals"
        params { maxIter = 60, maxDepth = 7, lossType = "absolute", stepSize = 0.1, subsamplingRate = 0.5, minInstancesPerNode = 20, maxMemoryInMB = 1024, cacheNodeIds = true, seed = 315 }
      }
      # One linear SVM per class through Spark's OneVsRest (the lab writes the same one-vs-rest out by hand).
      regime {
        algorithm = "linear-svc-ovr", label = "regime", weighted = true
        params { maxIter = 50, regParam = 0.01 }
      }
    }
  }

  # Kafka (ARCHITECTURE §9.1-9.2). From the host, the brokers' EXTERNAL listeners; conf/cluster.conf points
  # Spark inside Docker at the INTERNAL ones. Topic names match infra/kafka/create-topics.sh.
  kafka {
    bootstrap = "localhost:9092,localhost:9094,localhost:9096"
    topics {
      station-status = "velograph.gbfs.station-status.v1"
      weather = "velograph.weather.current.v1"
      trips-replay = "velograph.trips.replay.v1"
      trip-metrics = "velograph.trip-metrics.v1"
      predictions = "velograph.predictions.v1"
      alerts = "velograph.alerts.v1"
      dlq = "velograph.dlq.v1"
    }
  }

  # Live scoring (P5.3, ARCHITECTURE §9.4).
  live {
    trigger = "30 seconds"
    watermark = "10 minutes"     # event time is the station's last_reported
    max-offsets-per-trigger = 20000
    # A (re)started job rebuilds every station's state from this much of the station-status log. The producer
    # writes a full snapshot at least every 30 minutes, so the window always holds one.
    bootstrap-minutes = 35
    # A station's margin is max(min-bikes, capacity-share x capacity): EMPTY / FULL when its bikes (free docks)
    # are below it now, EMPTY_RISK / FULL_RISK when the projection for the next 60 minutes is.
    risk { min-bikes = 2, capacity-share = 0.10 }
    # Suggested moves: greedy surplus -> deficit matching inside a community, bringing a station back to
    # target-share of its capacity; the busiest empty stations first, max-moves at most.
    rebalancing { max-km = 2.5, max-bikes = 12, target-share = 0.5, max-moves = 40 }
    # Weather until the first weather message arrives: a mild, dry hour.
    default-weather {
      temp_c = 18.0, apparent_temp_c = 18.0, precip_mm = 0.0, wind_kmh = 10.0, humidity_pct = 65.0,
      cloud_pct = 50.0, is_raining = false
    }
    # Recent micro-batch reports kept in serving/live/stream-progress.json (both queries): an hour of the live job.
    progress-history = 240
  }

  # Trip replay analytics (P5.4, ARCHITECTURE §9.4): event time is the trip's start.
  replay {
    trigger = "10 seconds"
    watermark = "15 minutes"
    tumbling = "15 minutes"
    sliding { length = "60 minutes", slide = "15 minutes" }
    max-offsets-per-trigger = 50000
  }
}
