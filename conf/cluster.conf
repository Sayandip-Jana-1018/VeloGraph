# Docker standalone cluster (mode "cluster"): 2 workers x 2 cores, lake mounted at /opt/velograph/data.
# Never set data-root or spark.master here: docker-compose and infra/spark/spark-defaults.conf provide them.
velograph.spark.conf {
  "spark.sql.shuffle.partitions" = "8"
}
# Four cores in total: one edge partition each (EdgePartition2D on a 2 x 2 grid).
velograph.graph.partitions = 4
# Inside the Docker network the brokers are reached on their INTERNAL listeners.
velograph.kafka.bootstrap = "kafka-1:19092,kafka-2:19092,kafka-3:19092"
