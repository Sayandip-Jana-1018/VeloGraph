# Quiet Spark, keep VeloGraph and the Spark UI address visible. Loaded via -Dlog4j.configurationFile.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n%ex

logger.velograph.name = velograph
logger.velograph.level = info

logger.sparkui.name = org.apache.spark.ui.SparkUI
logger.sparkui.level = info

# Pure-Java BLAS fallback is fine for our model sizes; silence the "native BLAS not found" warnings.
logger.netlib.name = dev.ludovic.netlib
logger.netlib.level = error

# On Windows the JVM keeps the application jar locked, so Spark's shutdown hook cannot delete its temp copy and
# logs a harmless stack trace after every run. The temp directory is reclaimed by the OS later.
logger.shutdownhook.name = org.apache.spark.util.ShutdownHookManager
logger.shutdownhook.level = off
# The same locked-jar message, logged by SparkEnv when the session stops.
logger.sparkenv.name = org.apache.spark.SparkEnv
logger.sparkenv.level = error
